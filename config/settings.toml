# ============================================================
#  MFDS Insight — 설정 파일
#  이 파일에는 절대 API 키를 넣지 마십시오. 키는 .env 에서 읽습니다.
# ============================================================

[site]
title        = "의료기기 인허가 인사이트"
subtitle     = "MFDS 품목허가 공개데이터 기반 정기 분석"
author       = ""                      # 게시자명 (사이트 푸터)
base_url     = ""
# ↑ 사이트가 놓일 주소. 하위 경로에 올릴 때 반드시 지정하십시오.
#   프로젝트 저장소 Pages : "https://<계정>.github.io/<저장소명>"
#   사용자 사이트 하위폴더 : "https://<계정>.github.io/<폴더명>"
#   비워두면 머리글 링크가 도메인 최상단을 가리킵니다.
locale       = "ko-KR"
# 공공데이터 이용 시 출처 표시 의무. 임의로 지우지 마십시오.
attribution  = "출처: 식품의약품안전처 「의료기기 품목허가 정보」 (공공데이터포털 data.go.kr)"

[api]
# ★ 반드시 본인 계정에서 확인한 값으로 바꾸십시오. ★
#
#   공공데이터포털 > 마이페이지 > 데이터활용 > 오픈API > 활용신청 목록
#     → 해당 데이터 클릭 → [상세기능정보] 의 '요청주소' 를 그대로 복사
#
#   요청주소가  http://apis.data.go.kr/1471000/AaaService01/getAaaInq01  라면
#     base_url = "http://apis.data.go.kr/1471000/AaaService01"   (마지막 / 제외)
#     endpoint = "/getAaaInq01"
#
#   포털은 http:// 로 안내하지만, 프로그램이 https 로 자동 승격합니다(키 노출 방지).
#   부득이 평문 http 가 필요하면 allow_insecure_http = true 를 추가하십시오(비권장).
#
# 참고 — 검색으로 확인된 의료기기 계열 서비스 예시:
#   품목군정보   .../1471000/MdeqPrdgrInfoService01/getMdeqPrdgrInfoInq01
#   형명정보     .../1471000/MdeqModlInfoService01/getMdeqModlInq01
#   제조자정보   .../1471000/MdeqMnftrInfoService01/getMdeqMnftrInfoInq01
#   원자재정보   .../1471000/MdeqPrdlstCmdtInfoService01/getMdeqPrdlstCmdtInfoInq01
#   ※ '의료기기 품목허가 정보'(15057456) 의 서비스명은 위와 다르므로
#      추측하지 말고 반드시 포털에서 복사하십시오. (틀리면 오류코드 12 발생)
base_url        = "http://apis.data.go.kr/1471000/X"
endpoint        = "/getX"
page_param      = "pageNo"
size_param      = "numOfRows"
type_param      = "type"
response_format = "json"
page_size       = 500    # 21만건 기준 약 425페이지
max_pages       = 600            # 안전장치: 무한 페이징 방지
timeout_sec     = 20
max_retries     = 4
backoff_base    = 1.5            # 지수 백오프 기준(초)
rate_limit_qps  = 2.0            # 초당 요청 수 상한 (기관 API 예의)

# 수집 완전성 검사 — 통과하지 못하면 캐시를 갱신하지 않고 실패로 끝납니다.
#   · totalCount 대비 누락, max_pages 상한 도달
#   · 직전 정식 수집 대비 건수가 아래 비율(%)을 넘게 감소
max_row_drop_pct = 5
# 응답 본문의 결과코드 위치. 00(정상)·03(데이터 없음) 외 값이면 즉시 중단합니다.
result_code_path = ["header", "resultCode"]

# 응답 JSON에서 레코드 배열까지의 경로. probe 명령으로 확인 후 수정합니다.
records_path = ["body", "items"]
total_path   = ["body", "totalCount"]

# 각 레코드가 {"item": {...}} 처럼 한 겹 감싸여 오는 경우의 키.
# "auto" 면 단일 키가 dict 를 감싼 형태를 자동으로 벗겨냅니다. "" 면 벗기지 않습니다.
unwrap_key   = "auto"

# ------------------------------------------------------------
# 필드 매핑: API 원본 필드명 -> 내부 표준 컬럼명
# (2026-08 기준 실제 응답 확인값)
# ------------------------------------------------------------
[fields]
PRDUCT               = "품목명"
ENTRPS               = "업체명"
PRDUCT_PRMISN_NO     = "허가번호"
PRMISN_DT            = "허가일자"
MDEQ_PRDLST_SN       = "품목일련번호"
PRMISN_STTEMNT       = "허가신고구분코드"
RTRCN_DSCTN_DIVS_CD  = "취소취하구분코드"
RTRCN_DSCTN_DT       = "취소취하일자"
TRCK_MNG_TRGT_YN     = "추적관리대상"
MANUF_NM             = "제조원"
CHG_DT               = "변경일자"

# ------------------------------------------------------------
# 파생 컬럼: 원본에 없는 값을 규칙으로 만들어 냅니다.
#   source = 근거가 되는 표준 컬럼
#   rules  = [찾을문자열, 결과값] 목록. 위에서부터 먼저 걸리는 것을 적용.
#   default= 어느 것도 걸리지 않을 때 값
# ------------------------------------------------------------
[[derive]]
name    = "제조수입구분"
source  = "허가번호"
rules   = [["제신", "제조"], ["제허", "제조"], ["제인", "제조"], ["제조", "제조"],
           ["수신", "수입"], ["수허", "수입"], ["수인", "수입"], ["수입", "수입"]]
default = "미상"

[[derive]]
name    = "품목상태"
source  = "취소취하구분코드"
rules   = [["", "정상"]]          # 빈 값이면 정상
default = "취소·취하"

# ------------------------------------------------------------
# 코드값 라벨: 원본이 코드로 오는 항목의 표시 이름.
# 정확한 코드 의미는 포털 [참고문서] 의 활용가이드에서 확인해 채우십시오.
# 비워두면 코드 그대로 표시됩니다.
# ------------------------------------------------------------
[labels."허가신고구분코드"]
# "1" = "허가"
# "2" = "인증"
# "3" = "신고"

[labels."추적관리대상"]
Y = "대상"
N = "비대상"

# ------------------------------------------------------------
# 게시 허용 필드 (allowlist)
# 여기에 없는 필드는 어떤 산출물에도 절대 포함되지 않습니다.
# 신규 필드가 API에 추가되어도 자동 노출되지 않습니다. 반드시 유지하십시오.
# ------------------------------------------------------------
[publish]
allowed_columns = [
  "품목명", "업체명", "허가번호", "허가일자",
  "제조수입구분", "품목상태", "허가신고구분코드", "추적관리대상",
  "제조원", "취소취하일자",
]
max_rows_in_table = 200          # HTML 표에 넣을 최대 행 수
export_csv        = true
export_json       = true

# ------------------------------------------------------------
# 리포트 정의 — 새 리포트를 추가하려면 [[report]] 블록만 늘리면 됩니다.
# ------------------------------------------------------------
[[report]]
id       = "dental-implant"
title    = "치과용 임플란트 고정체 허가 동향"
slug     = "dental-implant-fixture"
keywords = ["치과용임플란트고정체", "치과용임플란트"]
# "치과용임플란트" 부분일치는 상부구조물·시술기구까지 잡으므로 명시적으로 제외한다.
# build 로그의 "포함된 품목명 상위" 를 보고 범위가 맞는지 확인하십시오.
exclude  = ["상부구조물", "어버트먼트", "시술기구", "수술기구"]
filters  = {}
charts   = ["yearly_trend", "status_mix", "top_companies", "domestic_vs_import"]   # status_mix 는 숫자로 표시
summary  = "국내 치과용 임플란트 고정체의 연도별 허가 추이와 업체 분포를 정리한 리포트입니다."

[[report]]
id       = "dental-abutment"
title    = "치과용 임플란트 상부구조물(어버트먼트) 허가 동향"
slug     = "dental-abutment"
keywords = ["치과용임플란트상부구조물", "어버트먼트"]
filters  = {}
charts   = ["yearly_trend", "status_mix", "top_companies"]
summary  = "어버트먼트 품목의 허가 추이와 주요 업체를 정리한 리포트입니다."

[[report]]
id       = "rf-device"
title    = "고주파 자극기 허가 동향"
slug     = "rf-stimulator"
keywords = ["고주파자극기", "고주파온열기"]
filters  = {}
charts   = ["yearly_trend", "status_mix", "top_companies"]
summary  = "고주파 계열 의료기기의 허가 현황을 정리한 리포트입니다."

[chart]
engine     = "matplotlib"        # 정적 SVG. 외부 스크립트를 로드하지 않습니다.
font       = "NanumGothic"       # 한글 폰트. 미설치 시 자동 대체 후 경고합니다.
# 색상 체계
#   "accent"  (기본) : 색은 의미가 있을 때만 씁니다.
#                      지표가 하나인 차트(연도별·업체별)는 남색 한 가지,
#                      항목 2개(제조·수입)는 남색 + 주황,
#                      항목 3개 이상(등급 등)은 색각이상 안전 범주색(Okabe–Ito 기반).
#   "rainbow"        : 빨·주·노·초·파·남·보. 모든 차트에서 항목마다 다른 색.
#                      노랑·연두는 흰 배경 대비 3:1 이상이 되도록 황토·올리브 톤으로 조정됩니다.
#   "palette"        : 아래 palette 를 순서대로 순환합니다.
scheme     = "accent"
palette    = ["#1F3864", "#C2570C", "#0072B2", "#D55E00", "#009E73", "#BD8300", "#CA73A3"]
# 차트는 화면 크기별로 두 장씩 만듭니다(데스크톱용·모바일용, <picture> 로 자동 선택).
# 글자 크기·높이는 항목 수에 맞춰 자동 결정되므로 보통은 바꿀 필요가 없습니다.
width_in   = 9.0          # 데스크톱용 폭. 줄이면 글자가 상대적으로 커집니다.
dpi        = 110
top_n      = 12

# ------------------------------------------------------------
# 대화형 탐색기 (브라우저에서 조건을 바꿔가며 집계)
#   데이터는 방문자가 한 번만 내려받고, 이후 계산은 전부 브라우저에서 처리합니다.
#   서버·DB 가 없으므로 조건을 아무리 바꿔도 추가 요청이 발생하지 않습니다.
# ------------------------------------------------------------
[explorer]
enabled  = true
slug     = "explore"
max_rows = 60000          # 이보다 많으면 최신 허가부터 잘라냅니다(용량·속도 보호)

# 표와 CSV 에 노출할 컬럼. publish.allowed_columns 안에서만 고르십시오.
columns = ["품목명", "업체명", "허가번호", "허가일자", "제조수입구분", "품목상태", "추적관리대상"]

# 체크박스/드롭다운 필터로 쓸 컬럼 (고유값 30개 이하면 체크박스, 초과하면 드롭다운)
facet_columns = ["제조수입구분", "품목상태", "추적관리대상", "품목명"]

# 텍스트 검색 대상 컬럼
search_columns = ["품목명", "업체명"]
